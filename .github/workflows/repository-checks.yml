name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tashkalinskaya_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: tashkalinskaya
        options: >-
          --health-cmd "pg_isready -U tashkalinskaya -d tashkalinskaya_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_REQUIRED: "true"
      DATABASE_URL: postgresql://tashkalinskaya:ci-only-password@localhost:5432/tashkalinskaya_ci
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply migrations twice
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Validate repository
        run: bash scripts/check-repository.sh

  container-build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service:
          - api
          - web
          - worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container
        run: docker build --file deploy/docker/Dockerfile.${{ matrix.service }} --tag tashkalinskaya-${{ matrix.service }}:${{ github.sha }} .
