name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tashkalinskaya_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: tashkalinskaya
        options: >-
          --health-cmd "pg_isready -U tashkalinskaya -d tashkalinskaya_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_REQUIRED: "true"
      DATABASE_URL: postgresql://tashkalinskaya:ci-only-password@localhost:5432/tashkalinskaya_ci
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply migrations twice
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Verify recovery manifest round trip
        env:
          RECOVERY_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npm run test:recovery:capture -- --output /tmp/recovery-manifest.json
          npm run test:recovery:verify -- --input /tmp/recovery-manifest.json

      - name: Validate repository
        run: bash scripts/check-repository.sh

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Build fresh web and run browser and HTTP regression
        run: npm run test:e2e

  container-build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service:
          - app
          - api
          - web
          - worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container
        run: docker build --file deploy/docker/Dockerfile.${{ matrix.service }} --tag tashkalinskaya-${{ matrix.service }}:${{ github.sha }} .

  staging-manifest:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_VERSION: ci-placeholder
      AUTH_TOKEN_PEPPER: ci-auth-token-pepper-at-least-32-characters
      CSRF_SECRET: ci-csrf-secret-at-least-32-characters
      DATABASE_URL: postgresql://staging:placeholder@database.internal:5432/staging
      PUBLIC_ORIGIN: https://staging.example.invalid
      PUSH_SUBSCRIPTION_ENCRYPTION_KEY: ci-push-encryption-key-at-least-32-characters
      PUSH_VAPID_PRIVATE_KEY: ci-vapid-private-key-at-least-twenty
      PUSH_VAPID_PUBLIC_KEY: ci-vapid-public-key-at-least-twenty
      PUSH_VAPID_SUBJECT: mailto:owner@example.invalid
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_BUCKET: ci-placeholder
      S3_ENDPOINT: https://s3.example.invalid
      S3_REGION: ru-1
      S3_SECRET_ACCESS_KEY: ci-placeholder
      SESSION_TOKEN_PEPPER: ci-session-token-pepper-at-least-32-characters
      WEBAUTHN_RP_ID: staging.example.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Timeweb Compose
        run: docker compose --file docker-compose.yml config --quiet
