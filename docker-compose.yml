# Timeweb App Platform staging manifest. Local development uses compose.yaml.
# The web service must remain first: App Platform proxies the public domain only to it.
# Every service declares the same build so App Platform always rebuilds the
# selected commit. BuildKit shares identical layers and executes the costly
# npm/TypeScript/Next.js build only once.
x-app-build: &app-build
  context: .
  dockerfile: deploy/docker/Dockerfile.app
  args:
    INTERNAL_API_URL: http://api:4000/api/v1
    NEXT_PUBLIC_API_URL: /api/v1

services:
  web:
    build: *app-build
    command:
      - node
      - apps/web/server.js
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)})
      interval: 10s
      timeout: 5s
      retries: 12
    # Timeweb App Platform discovers the public service only from a fixed
    # published port. Stop the current staging app before a manual deploy so
    # the replacement container can bind this port without overlap.
    ports:
      - "3000:3000"
    restart: unless-stopped

  migrate:
    build: *app-build
    command:
      - node
      - packages/database/dist/migrate.js
    environment:
      DATABASE_SSL: require
      DATABASE_TLS_SHA256: "93:F8:43:90:A5:E5:04:FD:EE:FF:FC:66:7E:ED:2B:CD:B2:32:15:D6:2F:77:E6:5D:6E:5E:B1:B9:61:EA:FC:35"
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  bootstrap-admin:
    build: *app-build
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        if [ "$${BOOTSTRAP_ADMIN_ENABLED:-false}" = "true" ]; then
          node apps/api/dist/identity/bootstrap-admin.js
        else
          echo "Bootstrap admin is disabled"
        fi
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER}
      BOOTSTRAP_ADMIN_ACTIVATION_CODE: ${BOOTSTRAP_ADMIN_ACTIVATION_CODE:-}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-}
      BOOTSTRAP_ADMIN_PERSONNEL_NUMBER: ${BOOTSTRAP_ADMIN_PERSONNEL_NUMBER:-}
      DATABASE_SSL: require
      DATABASE_TLS_SHA256: "93:F8:43:90:A5:E5:04:FD:EE:FF:FC:66:7E:ED:2B:CD:B2:32:15:D6:2F:77:E6:5D:6E:5E:B1:B9:61:EA:FC:35"
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  api:
    build: *app-build
    command:
      - node
      - apps/api/dist/main.js
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      API_PORT: 4000
      APP_VERSION: ${APP_VERSION}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER}
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      CSRF_SECRET: ${CSRF_SECRET}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      DATABASE_REQUIRED: "true"
      DATABASE_SSL: require
      DATABASE_TLS_SHA256: "93:F8:43:90:A5:E5:04:FD:EE:FF:FC:66:7E:ED:2B:CD:B2:32:15:D6:2F:77:E6:5D:6E:5E:B1:B9:61:EA:FC:35"
      DATABASE_URL: ${DATABASE_URL}
      FILE_STORAGE_DRIVER: s3
      NODE_ENV: staging
      PUSH_SUBSCRIPTION_ENCRYPTION_KEY: ${PUSH_SUBSCRIPTION_ENCRYPTION_KEY}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER}
      STAGING_LOAD_AUTH_ENABLED: ${STAGING_LOAD_AUTH_ENABLED:-false}
      STAGING_LOAD_LOGIN: ${STAGING_LOAD_LOGIN:-}
      STAGING_LOAD_TOKEN_SHA256: ${STAGING_LOAD_TOKEN_SHA256:-}
      WEBAUTHN_ORIGINS: ${PUBLIC_ORIGIN}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: Ташкалинская фабрика — staging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: *app-build
    command:
      - node
      - apps/worker/dist/main.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_VERSION: ${APP_VERSION}
      DATABASE_REQUIRED: "true"
      DATABASE_SSL: require
      DATABASE_TLS_SHA256: "93:F8:43:90:A5:E5:04:FD:EE:FF:FC:66:7E:ED:2B:CD:B2:32:15:D6:2F:77:E6:5D:6E:5E:B1:B9:61:EA:FC:35"
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: staging
      PUSH_SUBSCRIPTION_ENCRYPTION_KEY: ${PUSH_SUBSCRIPTION_ENCRYPTION_KEY}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT}
      WORKER_POLL_INTERVAL_MS: 5000
    restart: unless-stopped
