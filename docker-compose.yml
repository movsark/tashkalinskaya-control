# Temporary private-VPC certificate probe. This branch is never merged into main.
services:
  inspect-db-certificate:
    image: node:24-bookworm-slim
    command:
      - node
      - -e
      - |
        const { X509Certificate } = require('node:crypto');
        const net = require('node:net');
        const tls = require('node:tls');
        const url = new URL(process.env.DATABASE_URL);
        const socket = net.connect({ host: url.hostname, port: Number(url.port || '5432') });
        socket.once('connect', () => socket.write(Buffer.from([0, 0, 0, 8, 4, 210, 22, 47])));
        socket.once('data', (response) => {
          if (response[0] !== 83) throw new Error('PostgreSQL rejected SSL request');
          const secure = tls.connect({ socket, rejectUnauthorized: false });
          secure.once('secureConnect', () => {
            const raw = secure.getPeerCertificate(true).raw;
            const certificate = new X509Certificate(raw);
            console.log('DB_CERTIFICATE_DER_BASE64=' + raw.toString('base64'));
            console.log('DB_CERTIFICATE_SHA256=' + certificate.fingerprint256);
            secure.end();
            setTimeout(() => process.exit(75), 50);
          });
          secure.once('error', (error) => {
            console.log('DB_CERTIFICATE_PROBE_FAILED=' + error.message);
            process.exit(76);
          });
        });
        socket.once('error', (error) => {
          console.log('DB_CERTIFICATE_PROBE_FAILED=' + error.message);
          process.exit(77);
        });
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"
